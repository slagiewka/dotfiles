[bootstrap.packages]
"brew:btop" = "latest"
"brew:granted" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:keepassxc" = "latest"
"brew-cask:localsend" = "latest"
"brew-cask:font-monaspace" = "latest"
"brew-cask:battery" = "latest"

[bootstrap.macos.dock]
autohide = true
show_recents = false
mru_spaces = false

[bootstrap.macos.keyboard]
press_and_hold = false

[bootstrap.macos.trackpad]
tap_to_click = true
