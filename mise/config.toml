[tools]
aws = { version = "latest", symlink_bins = "true" }
btop = [
  { version = "latest", os = ["linux"] },
  { version = "1.2.13", os = ["macos"] },
]
bun = "latest"
claude = "latest"
deno = "latest"
direnv = "latest"
fzf = "latest"
go = "1.26"
golangci-lint = "latest"
granted = [
  { version = "latest", os = ["linux"] },
  { version = "0.38.0", os = ["macos"] },
]
herdr = "latest"
k9s = "latest"
kubectl = "latest"
lazydocker = "latest"
lazygit = "latest"
neovim = "0.12.4"
node = "26"
nub = "latest"
opencode = "latest"
pnpm = "11"
terraform = "latest"
uv = "latest"
bottom = "latest"
fastfetch = "latest"
usage = "latest"
jq = "latest"
gh = "latest"
tree-sitter = "latest"
ninja = "latest"
"postgres-binary:postgres" = "18.4.0"
starship = "latest"
ripgrep = "latest"
"vfox:jdx/vfox-mysql" = "8.4"

[settings]
idiomatic_version_file_enable_tools = ["node", "go", "npm"]

[plugins]
postgres-binary = "https://github.com/kyleking/mise-postgres-binary"
