[tools]
aws = { version = "latest", symlink_bins = "true" }
btop = [{ version = "latest", os = ["linux"] }]
bun = "latest"
claude = "latest"
deno = "latest"
fzf = "latest"
go = "1.26"
golangci-lint = "latest"
granted = [{ version = "latest", os = ["linux"] }]
herdr = "latest"
k9s = "latest"
kubectl = "latest"
lazydocker = "latest"
lazygit = "latest"
neovim = "0.12.4"
node = "26"
nub = "latest"
opencode = "latest"
pnpm = "11"
terraform = "latest"
uv = "latest"
bottom = "latest"
fastfetch = "latest"
usage = "latest"
jq = "latest"
gh = "latest"
tree-sitter = "latest"
ninja = "latest"
"postgres-binary:postgres" = "18"
starship = "latest"
ripgrep = "latest"
"vfox:jdx/vfox-mysql" = "8.4"
"github:bjarneo/cliamp" = "latest"

[tools."github:dmtrKovalenko/fff"]
version = "latest"
matching = "fff-mcp"
bin = "fff-mcp"

[settings]
idiomatic_version_file_enable_tools = ["node", "go", "npm", "pnpm"]

[plugins]
postgres-binary = "https://github.com/kyleking/mise-postgres-binary"

[bootstrap.hooks]
pre-packages = [
  "if command -v dnf >/dev/null 2>&1 && ! dnf repolist --enabled tailscale-stable >/dev/null 2>&1; then sudo dnf config-manager --add-repo https://pkgs.tailscale.com/stable/fedora/tailscale.repo; fi",
  "if command -v dnf >/dev/null 2>&1 && ! dnf repolist --enabled copr:copr.fedorainfracloud.org:scottames:ghostty >/dev/null 2>&1; then sudo dnf copr enable -y scottames/ghostty; fi",
]

[bootstrap.packages]
"dnf:git" = "latest"
"dnf:zsh" = "latest"
"dnf:tailscale" = "latest"
"dnf:ghostty" = "latest"
"flatpak:org.localsend.localsend_app" = "latest"
"flatpak:com.yubico.yubioath" = "latest"

[bootstrap.services]
tailscaled = {}

[bootstrap.repos]
"~/.antidote" = { url = "https://github.com/mattmc3/antidote.git", ref = "v2.2.1" }
"~/.config/nvim" = { url = "https://github.com/slagiewka/nvimconf.git", ref = "main" }
"~/code/work/dotfiles-work" = { url = "https://github.com/slagiewka/dotfiles-work.git", ref = "master" }

[bootstrap.macos.dock]
autohide = true
show_recents = false
mru_spaces = false

[bootstrap.macos.keyboard]
press_and_hold = false

[bootstrap.macos.trackpad]
tap_to_click = true

[dotfiles]
"~/.config/mise/miserc.toml" = "~/code/slagiewka/dotfiles/mise/miserc.toml"
"~/.config/mise/config.toml" = "~/code/slagiewka/dotfiles/mise/config.toml"
"~/.config/mise/config.macos.toml" = "~/code/slagiewka/dotfiles/mise/config.macos.toml"
"~/.config/mise/conf.d/work.toml" = "~/code/work/dotfiles-work/work.toml"
"~/.zshrc" = "~/code/slagiewka/dotfiles/zsh/.zshrc"
"~/.zsh_plugins.txt" = "~/code/slagiewka/dotfiles/zsh/.zsh_plugins.txt"
"~/.gitconfig" = "~/code/slagiewka/dotfiles/git/.gitconfig"
"~/.config/git/ignore" = "~/code/slagiewka/dotfiles/git/ignore"
"~/.config/ghostty" = "~/code/slagiewka/dotfiles/ghostty"

[bootstrap.user]
login_shell = "/bin/zsh"
